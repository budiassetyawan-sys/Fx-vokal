plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'id.mixer.vokal'
    compileSdk 34
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'id.mixer.vokal'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildFeatures { prefab true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'com.google.oboe:oboe:1.9.0'
}
